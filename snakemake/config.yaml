samples: []

scriptsdir: "scripts"
kraken_db: "/sc/arion/projects/schzrnas/zhangy40/softwares/kuniq_microbialdb_minus_kdb.20230808"
kraken_db_suppl: "/sc/arion/projects/schzrnas/zhangy40/softwares/kuniq_supplemental_vf_db_v2"
use_suppl_db: true   # set false to skip supplemental DB and run primary only
blastdb: "/sc/arion/projects/schzrnas/zhangy40/softwares/blast_db/nt"
# NCBI taxdump for taxonkit. Was ~/.taxonkit (unreadable to anyone but zhangy40);
# this copy in project space is byte-identical (verified by cmp on all 4 .dmp files).
taxonkit_data_dir: "/sc/arion/projects/schzrnas/zhangy40/softwares/taxdump"
t2t_ref: "/sc/arion/projects/schzrnas/zhangy40/ref/CHM13_T2T/chm13v2.0.mmi"

# Post-BLAST ONT construct-dominance filter. Qualifying intervals are merged;
# reads with >=40% merged technical coverage are removed.
filter_ont_adapters: true
ont_adapter_fasta: ""  # empty = bundled resources/ont_barcode_adapter_sequences.fasta
ont_adapter_evalue: 10
ont_adapter_min_overlap: 12
ont_adapter_min_identity: 90.0
ont_adapter_min_technical_fraction: 0.40
blast_min_query_coverage: 0.5

lsf:
  project: "acc_schzrnas"
  queue_default: "premium"
  queue_express: "express"

threads:
  unmapped_analysis: 10
  samtools_stats: 10
  krakenuniq: 2
  megablast: 16
  median_length_adj: 1
  ont_adapter_filter: 2

resources:
  unmapped_analysis_mem_mb: 12000
  samtools_stats_mem_mb: 6000
  krakenuniq_mem_mb: 180000
  megablast_mem_mb: 30000
  blast_process_mem_mb: 30000
  median_length_adj_mem_mb: 8000
  ont_adapter_filter_mem_mb: 4000

batch:
  blast_chunk_size: 10000
